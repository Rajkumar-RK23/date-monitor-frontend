<div class="layout-container">
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      <div class="navbar-brand">
        <span class="logo-icon">🩸</span>
        <h1 class="brand-title">Period Monitor</h1>
      </div>

      <!-- Mobile Menu Button -->
      <button
        class="menu-toggle"
        [class.active]="menuOpen()"
        (click)="toggleMenu()"
        aria-label="Toggle menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Navigation Menu -->
      <ul class="nav-menu" [class.active]="menuOpen()">
        <li class="nav-item">
          <a routerLink="/dashboard/home" routerLinkActive="active" (click)="closeMenu()">
            <span class="icon">📊</span>
            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/dashboard/periods" routerLinkActive="active" (click)="closeMenu()">
            <span class="icon">📅</span>
            Periods
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/dashboard/reports" routerLinkActive="active" (click)="closeMenu()">
            <span class="icon">📈</span>
            Reports
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/dashboard/settings" routerLinkActive="active" (click)="closeMenu()">
            <span class="icon">⚙️</span>
            Settings
          </a>
        </li>
      </ul>

      <!-- User Menu -->
      <div class="user-menu">
        @if (currentUser()) {
          <div class="user-info">
            <span class="user-avatar">👤</span>
            <span class="user-email">{{ currentUser()?.email }}</span>
          </div>
        }
        <button class="logout-btn" (click)="logout()" title="Logout">
          🚪
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2024 Period Monitor. All rights reserved.</p>
    <p>Track your health with confidence</p>
  </footer>
</div>
